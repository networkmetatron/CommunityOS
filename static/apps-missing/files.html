<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Files — not installed</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e7ecf3; background: #0f1419; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
    .card {
      max-width: 28rem; background: #1a2332; border: 1px solid #2a3548;
      border-radius: 1rem; padding: 1.5rem 1.6rem; line-height: 1.5;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
    p { margin: 0.55rem 0; color: #9aa8bc; font-size: 0.98rem; }
    code {
      display: block; margin-top: 0.85rem; padding: 0.75rem 0.9rem;
      background: #0f1419; border-radius: 0.5rem; color: #93c5fd; font-size: 0.9rem;
    }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Files is not installed</h1>
    <p>Personal and shared file storage powered by Nextcloud.</p>
    <p>Install it on the server with:</p>
    <code>sudo communityos app install nextcloud</code>
    <p style="margin-top:1rem">Data will live under /opt/communityos/data/nextcloud/</p>
    <p><a href="https://community.home.arpa">Back to CommunityOS</a></p>
  </div>
</body>
</html>
