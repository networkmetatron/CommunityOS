# CommunityOS optional app: SearXNG (privacy-oriented metasearch)
services:
  searxng:
    image: ghcr.io/searxng/searxng:2026.7.28-c01178d03
    container_name: communityos-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: https://${DOMAIN_SEARCH:-search.${DOMAIN_BASE}}/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./data/search:/etc/searxng
    # No host ports — Caddy is the only entrypoint
    networks:
      - default
