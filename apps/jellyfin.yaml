# CommunityOS optional app: Jellyfin (media)
# First admin: jellyfin-init (GET /Startup/User → POST → Complete → AuthenticateByName).
# Host install path recovers inconsistent empty-user state by stopping Jellyfin,
# reopening the wizard in system.xml, then starting before this init runs.
services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.3
    container_name: communityos-jellyfin
    restart: unless-stopped
    environment:
      JELLYFIN_PublishedServerUrl: https://${DOMAIN_MEDIA:-media.${DOMAIN_BASE:-community.home.arpa}}
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ./data/jellyfin/media:/media

  jellyfin-init:
    image: curlimages/curl:8.11.1
    container_name: communityos-jellyfin-init
    restart: "no"
    depends_on:
      - jellyfin
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        JF=http://jellyfin:8096
        echo "Waiting for Jellyfin..."
        ready=0
        i=0
        while [ "$$i" -lt 90 ]; do
          if curl -fsS "$$JF/System/Info/Public" >/dev/null 2>&1; then
            ready=1
            break
          fi
          i=$$((i + 1))
          sleep 2
        done
        if [ "$$ready" -ne 1 ]; then
          echo "FAIL: Jellyfin did not become reachable"
          exit 1
        fi

        users_public() {
          curl -fsS "$$JF/Users/Public" 2>/dev/null || echo "[]"
        }

        user_exists() {
          users_public | grep -q "\"Name\":\"$${ADMIN_USER}\""
        }

        # Prefer login check — /Users/Public omits IsHidden admins
        auth0="$$(curl -s -o /dev/null -w "%{http_code}" -X POST "$$JF/Users/AuthenticateByName" \
          -H "Content-Type: application/json" \
          -H "X-Emby-Authorization: MediaBrowser Client=\"CommunityOS\", Device=\"init\", DeviceId=\"communityos-init\", Version=\"1.0.0\"" \
          -d "{\"Username\":\"$${ADMIN_USER}\",\"Pw\":\"$${ADMIN_PASS}\"}" 2>/dev/null || echo 000)"
        if [ "$$auth0" = "200" ]; then
          echo "Jellyfin admin already present: $${ADMIN_USER}"
          exit 0
        fi

        # Wait for startup wizard API (must be open — host recovery opens it if needed)
        wiz=0
        i=0
        while [ "$$i" -lt 60 ]; do
          code="$$(curl -s -o /dev/null -w "%{http_code}" "$$JF/Startup/Configuration" 2>/dev/null || echo 000)"
          if [ "$$code" = "200" ]; then
            wiz=1
            break
          fi
        auth_w="$$(curl -s -o /dev/null -w "%{http_code}" -X POST "$$JF/Users/AuthenticateByName" \
          -H "Content-Type: application/json" \
          -H "X-Emby-Authorization: MediaBrowser Client=\"CommunityOS\", Device=\"init\", DeviceId=\"communityos-init\", Version=\"1.0.0\"" \
          -d "{\"Username\":\"$${ADMIN_USER}\",\"Pw\":\"$${ADMIN_PASS}\"}" 2>/dev/null || echo 000)"
          if [ "$$auth_w" = "200" ]; then
            echo "Jellyfin admin present: $${ADMIN_USER}"
            exit 0
          fi
          i=$$((i + 1))
          sleep 2
        done
        if [ "$$wiz" -ne 1 ]; then
          echo "FAIL: Jellyfin startup wizard is not open (GET /Startup/Configuration != 200)"
          echo "Users/Public=$$(users_public)"
          exit 1
        fi

        echo "Completing Jellyfin first-run as $${ADMIN_USER}..."

        # GET creates the placeholder first user; POST alone fails with Sequence contains no elements
        if ! curl -fsS "$$JF/Startup/User" >/tmp/jf-startup-user.json; then
          echo "FAIL: GET /Startup/User failed"
          exit 1
        fi
        echo "Startup placeholder: $$(cat /tmp/jf-startup-user.json)"

        code="$$(curl -s -o /tmp/jf-post.txt -w "%{http_code}" -X POST "$$JF/Startup/User" \
          -H "Content-Type: application/json" \
          -d "{\"Name\":\"$${ADMIN_USER}\",\"Password\":\"$${ADMIN_PASS}\"}")"
        if [ "$$code" != "200" ] && [ "$$code" != "204" ]; then
          echo "FAIL: POST /Startup/User returned HTTP $${code}"
          cat /tmp/jf-post.txt 2>/dev/null || true
          exit 1
        fi

        code="$$(curl -s -o /tmp/jf-cfg.txt -w "%{http_code}" -X POST "$$JF/Startup/Configuration" \
          -H "Content-Type: application/json" \
          -d '{"UICulture":"en-US","MetadataCountryCode":"US","PreferredMetadataLanguage":"en"}')"
        if [ "$$code" != "200" ] && [ "$$code" != "204" ]; then
          echo "FAIL: POST /Startup/Configuration returned HTTP $${code}"
          cat /tmp/jf-cfg.txt 2>/dev/null || true
          exit 1
        fi

        code="$$(curl -s -o /tmp/jf-ra.txt -w "%{http_code}" -X POST "$$JF/Startup/RemoteAccess" \
          -H "Content-Type: application/json" \
          -d '{"EnableRemoteAccess":true,"EnableAutomaticPortMapping":false}')"
        if [ "$$code" != "200" ] && [ "$$code" != "204" ]; then
          echo "FAIL: POST /Startup/RemoteAccess returned HTTP $${code}"
          cat /tmp/jf-ra.txt 2>/dev/null || true
          exit 1
        fi

        code="$$(curl -s -o /tmp/jf-done.txt -w "%{http_code}" -X POST "$$JF/Startup/Complete")"
        if [ "$$code" != "200" ] && [ "$$code" != "204" ]; then
          echo "FAIL: POST /Startup/Complete returned HTTP $${code}"
          cat /tmp/jf-done.txt 2>/dev/null || true
          exit 1
        fi

        # Admins are often IsHidden=true — /Users/Public returns [] and is NOT a success check.
        # Verify only via AuthenticateByName (HTTP 200).
        i=0
        while [ "$$i" -lt 20 ]; do
          auth_code="$$(curl -s -o /tmp/jf-auth.txt -w "%{http_code}" -X POST "$$JF/Users/AuthenticateByName" \
            -H "Content-Type: application/json" \
            -H "X-Emby-Authorization: MediaBrowser Client=\"CommunityOS\", Device=\"init\", DeviceId=\"communityos-init\", Version=\"1.0.0\"" \
            -d "{\"Username\":\"$${ADMIN_USER}\",\"Pw\":\"$${ADMIN_PASS}\"}")"
          if [ "$$auth_code" = "200" ]; then
            echo "Jellyfin admin ready: $${ADMIN_USER}"
            exit 0
          fi
          i=$$((i + 1))
          sleep 2
        done

        echo "FAIL: Jellyfin admin login failed after provisioning (AuthenticateByName)"
        echo "Last HTTP=$${auth_code:-unknown}"
        cat /tmp/jf-auth.txt 2>/dev/null || true
        exit 1
volumes:
  jellyfin_config:
  jellyfin_cache:
