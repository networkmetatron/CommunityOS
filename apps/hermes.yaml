# CommunityOS optional app: Hermes Agent + native web dashboard
# MIT License — https://github.com/NousResearch/hermes-agent
# Image pin: Hermes Agent v0.20.0 — docker tag v2026.8.3
#
# Architecture:
#   Open WebUI  →  http://hermes:8642/v1  (API, internal only)
#   Caddy       →  http://hermes:9119     (dashboard, internal only)
#                  https://hermes.community.home.arpa/  (admin HTTPS)
#   Hermes      →  http://ollama:11434/v1
#
# No host/LAN ports published for 8642 or 9119.
# Dashboard auth is Hermes Basic Auth (not bypassed by Caddy).

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.8.3
    container_name: communityos-hermes
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    command: ["gateway", "run"]
    environment:
      # OpenAI-compatible API for Open WebUI (internal network only)
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
      HERMES_HOME: /opt/data
      # Native dashboard in the same container (s6-supervised side process)
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      # Mandatory auth on non-loopback bind (do not use deprecated INSECURE)
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD}
      # Browser Chat tab (embedded TUI via PTY) — optional extra capability
      HERMES_DASHBOARD_TUI: "1"
    volumes:
      - ./data/hermes:/opt/data
    # No ports: — Caddy reaches hermes:9119 on the compose network only
    mem_limit: 4g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8642/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
